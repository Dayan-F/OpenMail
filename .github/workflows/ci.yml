name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # No secrets needed: the build only type-checks and compiles. Runtime
          # config (Groq key, OAuth, Turso) is read per request, not at build time.
          DATABASE_URL: file:ci.db
